version: 2

sources:
  - name: normalized
    schema: normalized
    description: Validated records committed atomically by the Python collector.
    tables:
      - name: station_snapshots
        description: One metadata record per collection and station, even if status is missing.
        columns:
          - name: collection_id
            data_tests:
              - not_null
          - name: station_id
            data_tests:
              - not_null
          - name: information_raw_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'feed_payloads')
                    field: raw_id
      - name: observations
        description: Actual station availability reports; no synthetic observations.
        columns:
          - name: status_raw_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'feed_payloads')
                    field: raw_id
      - name: ttc_gtfs_versions
        description: One row per loaded TTC static GTFS zip (subway subset), keyed by its SHA-256.
        columns:
          - name: feed_version
            data_tests:
              - unique
              - not_null
      - name: ttc_line_stops
        description: Platform order along each line direction for a feed version.
      - name: ttc_stops
      - name: ttc_trips
      - name: ttc_stop_times
      - name: ttc_calendar
      - name: ttc_calendar_dates
      - name: ttc_train_stop_events
        description: One row per train visit to a platform, keyed by train (vehicle label).
        columns:
          - name: event_id
            data_tests:
              - unique
              - not_null
      - name: ttc_alerts
      - name: ttc_alert_versions
  - name: ops
    schema: ops
    tables:
      - name: ingestion_runs
        columns:
          - name: collection_id
            data_tests:
              - unique
              - not_null
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['running', 'succeeded', 'failed']
      - name: ttc_poll_runs
        description: One row per TTC realtime feed poll.
      - name: ttc_feed_state
        description: The newest normalized snapshot per TTC feed.
  - name: raw
    schema: raw
    tables:
      - name: feed_payloads
        description: Source JSONB and fetch metadata retained for replay and lineage.
        columns:
          - name: raw_id
            data_tests:
              - unique
              - not_null
